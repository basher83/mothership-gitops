apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anthropic-oauth-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/basher83/tailnet-microservices.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: anthropic-oauth-proxy
  syncPolicy:
    # Manual sync — promotion gate for the cross-repo boundary. This app
    # tracks tailnet-microservices main, whose CI does not gate manifest
    # validity; sync deliberately. See docs/architecture.md.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
