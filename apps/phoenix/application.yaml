# Phoenix - LLM observability eval backend
# SQLite mode, no Postgres dependency
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phoenix-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    chart: phoenix-helm
    repoURL: registry-1.docker.io/arizephoenix
    targetRevision: 9.0.3 # Phoenix 17.4.0
    helm:
      valuesObject:
        # PXI agent assistant (new in v17) left enabled: it uses Phoenix's
        # stored provider config, which points at the in-cluster
        # anthropic-oauth-proxy (no external egress required).
        # SQLite mode - no Postgres
        postgresql:
          enabled: false
        persistence:
          enabled: true
          storageClass: longhorn
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        # Recreate strategy avoids RWO volume scheduling conflicts
        # rollingUpdate must be null to prevent SSA conflict with Recreate type
        deployment:
          strategy:
            type: Recreate
            rollingUpdate: null
        # ClusterIP - using Tailscale Ingress instead of NodePort
        service:
          type: ClusterIP
        # Disable auth - Tailscale-only access, frictionless OTLP ingestion
        # NOTE: chart >= 9.x defaults enableAuth to true - keep this explicit
        auth:
          enableAuth: false
        server:
          # Prevent UI from loading external resources (Google Fonts etc.)
          # Pods have no outbound internet — external fetches hang the SPA
          allowExternalResources: false
        # Enable pod security context for nonroot image (UID 65532)
        securityContext:
          pod:
            enabled: true
        # Disable built-in ingress - using Tailscale Ingress
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: phoenix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
