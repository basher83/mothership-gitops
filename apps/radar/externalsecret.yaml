# ExternalSecret for Radar's get-only ArgoCD API token
# Pulls from Infisical: /radar/ARGOCD_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-argocd-token
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-radar
  target:
    name: radar-argocd-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ARGOCD_TOKEN
