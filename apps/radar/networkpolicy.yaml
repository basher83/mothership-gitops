# Admit Radar UI and MCP traffic only through its Tailscale Ingress proxy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radar-ingress
  namespace: radar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radar
      app.kubernetes.io/instance: radar
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-operator
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
              tailscale.com/parent-resource: radar
              tailscale.com/parent-resource-ns: radar
              tailscale.com/parent-resource-type: ingress
      ports:
        - protocol: TCP
          port: 9280
