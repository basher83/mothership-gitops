# Longhorn - Distributed block storage
# 2 replicas for Golf + Hotel workers
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.0 # exact pin — storage substrate; Renovate PRs bumps
    helm:
      valuesObject:
        defaultSettings:
          defaultReplicaCount: 2
          storageMinimalAvailablePercentage: 10
          defaultDataPath: /var/lib/longhorn
          createDefaultDiskLabeledNodes: true
          backupTarget: "s3://longhorn-backups@us-east-1/"
          backupTargetCredentialSecret: "longhorn-backup-credentials"
        persistence:
          defaultClass: true
          defaultClassReplicaCount: 2
        longhornUI:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      # No prune: chart-owned CRDs are unprotected — a chart revision that
      # stops rendering one would make it prune-eligible, deleting all CRs
      # stored under it (storage control-plane loss). See docs/architecture.md.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
