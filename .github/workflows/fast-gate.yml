name: Fast Gate

on:
  pull_request:
  push:
    branches:
      - main
      - renovate/**

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Mise tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          cache: true

      - name: Run fast gate
        run: mise run ci
